name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend — lint, typecheck, build, API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d calendar_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailhog:
        image: mailhog/mailhog
        ports: ['1025:1025', '8025:8025']
    env:
      DB_HOST: localhost
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      SMTP_HOST: localhost
      # Тесты меняют IP через X-Forwarded-For, чтобы не упираться в rate limit по IP
      TRUST_PROXY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Start API
        run: |
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:4000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm test
        env:
          API_URL: http://localhost:4000
          MAILHOG_URL: http://localhost:8025
      - if: failure()
        run: cat server.log

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
